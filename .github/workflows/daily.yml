name: VESGLIDX daily update

# Runs the tracker on GitHub's servers — no personal computer required.
on:
  schedule:
    # Several evening attempts so each close is published the same evening.
    # GitHub often starts scheduled runs late (sometimes by hours), and runs at
    # odd minutes are delayed less than runs on the hour. Every run is safe to
    # repeat: a day is recorded only once, and only after the close is final
    # (from 22:00 UTC), so extra runs just find nothing new.
    # Times in UTC; Phoenix is UTC-7 all year.
    - cron: '7 22 * * 1-5'     # 3:07pm Phoenix
    - cron: '37 22 * * 1-5'    # 3:37pm
    - cron: '13 23 * * 1-5'    # 4:13pm
    - cron: '47 23 * * 1-5'    # 4:47pm
    - cron: '23 1 * * 2-6'     # 6:23pm
    - cron: '53 2 * * 2-6'     # 7:53pm
    # Next-morning safety net, before the open (5:37am Phoenix).
    - cron: '37 12 * * 2-6'
  workflow_dispatch:   # also lets you run it on demand from the Actions tab

permissions:
  contents: write      # allows the run to publish the updated JSON back to the repo

concurrency:
  group: vesglidx-tracker   # never let two runs write the JSON at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run the VESGLIDX tracker
        env:
          # The tracker reads GITHUB_TOKEN to publish results. This is GitHub's
          # automatic per-run token — no personal access token needed here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vesglidx_daily_tracker.py

      # Verde ESG Market Neutral Index. Separate script and separate JSON
      # files; runs even if the step above fails, and never touches VESGLIDX.
      - name: Run the VESGMNX tracker
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vesgmnx_daily_tracker.py
