name: VESGLIDX daily update

# Runs the tracker on GitHub's servers — no personal computer required.
on:
  schedule:
    # 22:00 UTC = ~6:00pm US Eastern (after the 4:00pm market close),
    # Monday–Friday. Cron is always UTC and does not shift for daylight saving,
    # but 22:00 UTC lands after the close year-round (6pm EDT / 5pm EST).
    - cron: '0 22 * * 1-5'
    # Next-morning catch-up, 12:30 UTC Tue–Sat (8:30am EDT / 7:30am EST), before
    # the open. GitHub often starts the evening run hours late, when Yahoo's
    # newest daily bar can still be incomplete; the tracker skips an incomplete
    # day and this run records it. Runs that find nothing new write nothing.
    - cron: '30 12 * * 2-6'
  workflow_dispatch:   # also lets you run it on demand from the Actions tab

permissions:
  contents: write      # allows the run to publish the updated JSON back to the repo

concurrency:
  group: vesglidx-tracker   # never let two runs write the JSON at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run the VESGLIDX tracker
        env:
          # The tracker reads GITHUB_TOKEN to publish results. This is GitHub's
          # automatic per-run token — no personal access token needed here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vesglidx_daily_tracker.py

      # Verde ESG Market Neutral Index. Separate script and separate JSON
      # files; runs even if the step above fails, and never touches VESGLIDX.
      - name: Run the VESGMNX tracker
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vesgmnx_daily_tracker.py
